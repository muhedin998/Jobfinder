version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: jobfinder-postgres
    environment:
      POSTGRES_DB: jobfinder
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: root
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - jobfinder-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d jobfinder"]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jobfinder-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jobfinder.com
      PGADMIN_DEFAULT_PASSWORD: password123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - jobfinder-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  jobfinder-network:
    driver: bridge